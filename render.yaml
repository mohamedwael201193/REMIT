services:
  - type: web
    name: remit-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run keys:fetch && npm run front:circuit
    startCommand: npm run api
    healthCheckPath: /health
    envVars:
      - key: MIDNIGHT_NETWORK
        value: preprod
      - key: MIDNIGHT_INDEXER_URL
        value: https://midnight-preprod.blockfrost.io/api/v0
      - key: BLOCKFROST_PROJECT_ID
        sync: false
      - key: REMIT_API_CORS_ORIGIN
        value: "*"
