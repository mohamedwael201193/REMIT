name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Compact 0.31.1
        run: |
          curl -fsSL https://docs.midnight.network/compact.sh | bash || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          compact update 0.31 || compact update 0.31.1 || true
          compact compile --version || echo "compact missing on runner — skip-zk artifacts must be present"
      - run: npm ci || npm install
      - run: node scripts/secret-scan.mjs
      - run: node scripts/runtime-tree.mjs
      - name: Compile Compact
        run: |
          if command -v compact >/dev/null; then
            compact compile --skip-zk CONTRACT/src/remit_pool.compact CONTRACT/managed/remit_pool
            compact compile --skip-zk CONTRACT/src/remit_quote.compact CONTRACT/managed/remit_quote
          else
            echo "compact not installed; using committed skip-zk artifacts if present"
          fi
      - name: Unit tests
        run: npm run test:unit
      - name: Security tests
        run: npm run test:security
      - name: Privacy tests
        run: npm run test:privacy
      - name: Integration (compact-runtime lifecycle)
        run: npm run test:integration
      - run: node scripts/inspect-managed.mjs
      - name: Public documentation scan
        run: node scripts/public-doc-scan.mjs
      - name: API build
        run: npm run build -w @remit/api
      - name: Install frontend deps
        run: npm install --prefix front
      - name: Typecheck frontend
        run: npm run typecheck --prefix front
      - name: ABOUT character gate
        run: node scripts/about-count.mjs
      - name: Judge proof (local gates; tests already ran above)
        run: npx tsx scripts/judge-proof.ts
        env:
          JUDGE_SKIP_TESTS: "1"
          JUDGE_DEMO: "1"
